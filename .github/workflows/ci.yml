name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push the :latest tag"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aircarbon/ai-cpx

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: just lint

      - name: Build check
        run: just build-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.push_latest }}" == "true" ]] || \
             [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            just push "tag=$SHA_TAG"
          else
            just build "tag=$SHA_TAG"
          fi
