[project]
name = "ai-cpx"
version = "0.1.0"
description = "AI CPX - Carbon Project Risk Assessment Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "apscheduler>=3.10.0",
    "beanie==2.0.0",
    "boto3==1.39.0",
    "fastapi==0.109.1",
    "langchain==0.3.0",
    "langchain-community==0.3.0",
    "langchain-core==0.3.0",
    "langchain-openai==0.2.0",
    "langfuse==3.2.2",
    "pydantic>=2.7.0,<2.9.0",
    "pymongo==4.11.0",
    "pypdf==5.9.0",
    "python-dotenv==0.21.0",
    "requests==2.32.2",
    "uvicorn==0.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.format]
quote-style = "double"
